<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل الدخول - منصة سعود التعليمية</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <header>
    <h1>نظام الدخول الموحد</h1>
  </header>

  <main class="container centered">
    <h2>تسجيل الدخول</h2>

    <label for="username">اسم المستخدم</label>
    <input type="text" id="username" class="input" placeholder="أدخل اسم المستخدم" />

    <label for="password">كلمة المرور</label>
    <input type="password" id="password" class="input" placeholder="أدخل كلمة المرور" />

    <label for="role">اختر الدور</label>
    <select id="role" class="input">
      <option value="">-- اختر الدور --</option>
      <option value="student">👨‍🎓 طالب / ولي الأمر</option>
      <option value="staff">🧑‍🏫 موظف</option>
    </select>

    <button class="btn" onclick="login()">تسجيل الدخول</button>
    <p id="loginMessage" style="color: red; margin-top: 10px;"></p>
  </main>

  <footer>
    <p>© جميع الحقوق محفوظة - مدرسة الشيخ سعود - فرع1</p>
  </footer>

  <script>
    function login() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const role = document.getElementById("role").value;
      const msg = document.getElementById("loginMessage");

      msg.textContent = "";

      if (!username || !password || !role) {
        msg.textContent = "❌ يرجى تعبئة جميع الحقول";
        return;
      }

      // محاكاة تحقق بسيط (يمكن ربطه لاحقًا بالسيرفر)
      if (username === "admin" && password === "1234" && role === "staff") {
        sessionStorage.setItem("role", "staff");
        window.location.href = "staff_menu.html";
      } else if (username === "student" && password === "1234" && role === "student") {
        sessionStorage.setItem("role", "student");
        window.location.href = "student_menu.html";
      } else {
        msg.textContent = "❌ بيانات الدخول غير صحيحة";
      }
    }
  </script>
</body>
</html>
