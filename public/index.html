<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل الدخول - مدرسة الشيخ سعود - فرع1</title>
  <link rel="stylesheet" href="css/main.css" />
  <style>
    footer {
      text-align: center;
      padding: 15px;
      font-size: 0.9em;
      color: #777;
    }

    #loginSection {
      display: none;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <header>
    <h1>🔐 نظام الدخول الموحّد</h1>
  </header>

  <main class="container centered">
    <h2>مرحباً بك في مدرسة الشيخ سعود - فرع1</h2>

    <label for="role">اختر الدور</label>
    <select id="role" class="input" onchange="handleRoleSelection()">
      <option value="">-- اختر الدور --</option>
      <option value="student">👨‍🎓 طالب / ولي الأمر</option>
      <option value="staff">🧑‍🏫 موظف</option>
    </select>

    <!-- قسم تسجيل الدخول للموظف -->
    <div id="loginSection">
      <label for="username">اسم المستخدم</label>
      <input type="text" id="username" class="input" placeholder="أدخل اسم المستخدم" />

      <label for="password">كلمة المرور</label>
      <input type="password" id="password" class="input" placeholder="أدخل كلمة المرور" />

      <button class="btn" onclick="login()">تسجيل الدخول</button>
      <p id="loginMessage" style="color: red; margin-top: 10px;"></p>
    </div>
  </main>

  <footer>
    <p>© جميع الحقوق محفوظة - مدرسة الشيخ سعود - فرع1</p>
  </footer>

  <script>
    // ✅ التعامل مع اختيار الدور
    function handleRoleSelection() {
      const role = document.getElementById("role").value;
      const loginSection = document.getElementById("loginSection");
      const msg = document.getElementById("loginMessage");
      msg.textContent = "";

      if (role === "student") {
        // 🔹 انتقال مباشر لصفحة الطالب
        sessionStorage.setItem("role", "student");
        window.location.href = "student_menu.html";
      } 
      else if (role === "staff") {
        // 🔹 عرض نموذج تسجيل الدخول للموظف
        loginSection.style.display = "block";
      } 
      else {
        loginSection.style.display = "none";
      }
    }

    // ✅ التحقق من بيانات دخول الموظف
    function login() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const msg = document.getElementById("loginMessage");

      msg.textContent = "";

      if (!username || !password) {
        msg.textContent = "❌ يرجى إدخال اسم المستخدم وكلمة المرور";
        return;
      }

      // 🔹 تحقق تجريبي
      if (username === "admin" && password === "1234") {
        sessionStorage.setItem("role", "staff");
        window.location.href = "staff_menu.html";
      } else {
        msg.textContent = "❌ بيانات الدخول غير صحيحة";
      }
    }
  </script>
</body>
</html>
