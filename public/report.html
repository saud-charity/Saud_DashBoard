<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تقرير الطالب</title>
<link rel="stylesheet" href="css/main.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* نفس التنسيقات السابقة */
</style>
</head>
<body>
<header>📑 تقرير الطالب</header>
<div class="container">
  <div class="search-box">
    <input type="text" id="studentId" placeholder="أدخل رقم الهوية">
    <button onclick="loadReport()">عرض التقرير</button>
    <button id="printBtn" onclick="window.print()">🖨️ طباعة</button>
    <button id="downloadBtn">💾 تحميل PDF</button>
  </div>
  <div id="error" class="error"></div>
  <div id="report"></div>
</div>

<script>
async function loadReport() {
  const id = document.getElementById("studentId").value.trim();
  const reportDiv = document.getElementById("report");
  const errorDiv = document.getElementById("error");
  const printBtn = document.getElementById("printBtn");
  const downloadBtn = document.getElementById("downloadBtn");

  reportDiv.innerHTML = "";
  errorDiv.textContent = "";
  printBtn.style.display = "none";
  downloadBtn.style.display = "none";

  if (!id) {
    errorDiv.textContent = "❌ فضلاً أدخل رقم هوية الطالب.";
    return;
  }

  try {
    const res = await fetch(`/api/report/${id}`);
    if (!res.ok) {
      errorDiv.textContent = res.status === 404 ? "❌ الطالب غير موجود." : "❌ خطأ في تحميل التقرير.";
      return;
    }

    const data = await res.json();

    let html = `<div class="student-info">
                  <p><strong>الاسم:</strong> ${data.student["الاسم"]}</p>
                  <p><strong>الشعبة:</strong> ${data.student["الشعبة"]}</p>
                </div>`;

    data.subjects.forEach(sub => {
      html += `<h3 style="text-align:center; margin-top:20px;">${sub.name}</h3>`;
      html += `<table><thead><tr>`;
      Object.keys(sub).filter(k=>!["name","strengths","improvements"].includes(k)).forEach(h=>{
        html += `<th>${h}</th>`;
      });
      html += `</tr></thead><tbody><tr>`;
      Object.keys(sub).filter(k=>!["name","strengths","improvements"].includes(k)).forEach(h=>{
        html += `<td>${sub[h]}</td>`;
      });
      html += `</tr></tbody></table>`;

      if(sub.strengths || sub.improvements){
        html += `<div class="notes-box">
                  <div class="strengths"><h3>🟢 نقاط القوة</h3><ul>${sub.strengths ? `<li>${sub.strengths}</li>` : ""}</ul></div>
                  <div class="improvements"><h3>🔴 جوانب التحسين</h3><ul>${sub.improvements ? `<li>${sub.improvements}</li>` : ""}</ul></div>
                </div>`;
      }
    });

    reportDiv.innerHTML = html;
    printBtn.style.display = "inline-block";
    downloadBtn.style.display = "inline-block";

    downloadBtn.onclick = () => {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({orientation:"p", unit:"pt", format:"a4"});
      doc.html(reportDiv, {
        callback: function(pdf){ pdf.save(`${data.student["الاسم"]}_report.pdf`); },
        x:10, y:10, width:570, windowWidth: reportDiv.scrollWidth
      });
    };

  } catch(err){
    console.error(err);
    errorDiv.textContent = "❌ حدث خطأ غير متوقع.";
  }
}
</script>
</body>
</html>
