<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎓 لوحة التحكم</title>
<style>
  body {
    font-family: "Tahoma", Arial, sans-serif;
    text-align: center;
    padding: 20px;
    background: #f4f6f8;
  }
  h1 {
    margin-bottom: 20px;
    color: #333;
  }
  #menuContainer {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 15px;
  }
  .menu-btn {
    padding: 12px 20px;
    font-size: 1em;
    cursor: pointer;
    border: none;
    border-radius: 8px;
    background: #3498db;
    color: #fff;
    transition: 0.2s;
    min-width: 220px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  }
  .menu-btn:hover {
    background: #217dbb;
    transform: translateY(-2px);
  }

  /* PDF Viewer Section */
  #pdfContainer {
    display: none;
    flex-direction: column;
    align-items: center;
    margin-top: 20px;
    width: 100%;
  }

  #pdfViewer {
    width: 90%;
    height: 600px;
    border: 1px solid #ccc;
    border-radius: 8px;
  }

  #pdfControls {
    margin-top: 10px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .pdf-btn {
    padding: 10px 20px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 1em;
    color: white;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: 0.2s;
  }

  #downloadBtn { background-color: #3498db; }
  #downloadBtn:hover { background-color: #217dbb; }

  #printBtn { background-color: #f39c12; }
  #printBtn:hover { background-color: #d68910; }

  #closeBtn { background-color: #e74c3c; }
  #closeBtn:hover { background-color: #c0392b; }

  @media (max-width: 768px) {
    .menu-btn {
      width: 90%;
      font-size: 1em;
      padding: 10px;
    }
    #pdfViewer {
      width: 100%;
      height: 80vh;
    }
    #pdfControls {
      flex-direction: column;
      gap: 8px;
    }
    .pdf-btn {
      width: 80%;
      justify-content: center;
    }
  }
</style>
</head>
<body>

<h1 id="pageTitle">🎓 لوحة التحكم</h1>

<div id="menuContainer"></div>

<!-- PDF Viewer Section -->
<div id="pdfContainer">
  <iframe id="pdfViewer"></iframe>
  <div id="pdfControls">
    <button class="pdf-btn" id="downloadBtn">⬇ تحميل PDF</button>
    <button class="pdf-btn" id="printBtn">🖨️ طباعة PDF</button>
    <button class="pdf-btn" id="closeBtn">❌ إغلاق الملف</button>
  </div>
</div>
