<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة التحكم - مدرسة الشيخ سعود - فرع1</title>
  <link rel="stylesheet" href="css/main.css" />
  <style>
    .menu-container {
      max-width: 600px;
      margin: 20px auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .menu-btn {
      background: #3498db;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }
    .menu-btn:hover {
      background: #2980b9;
    }

    #pdfViewer {
      width: 90%;
      height: 600px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin: 20px auto;
      display: none;
    }
  </style>
</head>
<body>
  <header>
    <h1 id="pageTitle">لوحة التحكم</h1>
  </header>

  <main class="container">
    <div id="menuContainer" class="menu-container"></div>
    <iframe id="pdfViewer"></iframe>
  </main>

  <footer>
    <p>© جميع الحقوق محفوظة - مدرسة الشيخ سعود - فرع1</p>
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const role = sessionStorage.getItem("role");
      if (!role) { window.location.href = "login.html"; return; }

      document.getElementById("pageTitle").textContent =
        role === "staff" ? "🧑‍🏫 لوحة المعلم/ الإداري" : "🎓 لوحة الطالب / ولي الأمر";

      loadMenu(role);
    });

    async function loadMenu(role) {
      const container = document.getElementById("menuContainer");
      container.innerHTML = "";

      try {
        const res = await fetch(`/api/menu/${role}`);
        if (!res.ok) throw new Error("خطأ في تحميل القائمة");

        const menu = await res.json();
        if (!menu || menu.length === 0) { 
          container.innerHTML = "<p>❌ لا توجد عناصر</p>"; 
          return; 
        }

        menu.forEach(item => {
          const btn = document.createElement("button");
          btn.className = "menu-btn";
          btn.textContent = item.title;

          switch(item.type){
            case "pdf":
              btn.onclick = () => openPdf(item.filename);
              break;
            case "page":
              btn.onclick = () => window.location.href = item.path;
              break;
            case "external":
              btn.onclick = () => window.open(item.url, "_blank");
              break;
            case "submenu":
              btn.onclick = () => window.location.href = `/policies.html?role=${role}`;
              break;
            default:
              console.warn("نوع عنصر غير معروف:", item);
          }

          container.appendChild(btn);
        });
      } catch(err) {
        console.error(err);
        container.innerHTML = "<p>تعذر تحميل القائمة</p>";
      }
    }

    function openPdf(filename) {
      const viewer = document.getElementById("pdfViewer");
      viewer.src = `/pdfs/${filename}`;
      viewer.style.display = "block";
      viewer.scrollIntoView({ behavior: "smooth" });
    }
  </script>
</body>
</html>
