<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>قائمة الموظف</title>
  <link rel="stylesheet" href="styles/main.css">
  <style>
    .menu-btn {
      display: block;
      width: 100%;
      margin: 10px 0;
      padding: 12px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      background-color: #2980b9;
      color: #fff;
      cursor: pointer;
      text-align: right;
    }
    .menu-btn:hover { background-color: #3498db; }
  </style>
</head>
<body>
  <header>📋 قائمة الموظف</header>
  <div class="container">
    <div id="menuContainer"></div>
  </div>

  <script src="scripts/main.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      sessionStorage.setItem("role", "staff"); // تحديد الدور في الجلسة
      loadMenu("staff"); // جلب القائمة من السيرفر
    });
  </script>
</body>
</html>
