<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تسجيل دخول الموظف</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <div class="login-container">
    <h2>تسجيل دخول الموظف</h2>
    <div id="error" class="error" style="display:none"></div>
    <form id="loginForm" class="login-form">
      <label for="username">اسم المستخدم:</label>
      <input type="text" id="username" placeholder="أدخل اسم المستخدم" required>

      <label for="password">كلمة المرور:</label>
      <input type="password" id="password" placeholder="أدخل كلمة المرور" required>

      <button type="submit">تسجيل الدخول</button>
    </form>
  </div>

  <script src="scripts/main.js"></script>
  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const res = await apiPost("/api/login", { username, password });
      if (res.success) {
        sessionStorage.setItem("role", "staff"); // تخزين الدور
        location.href = "/staff_menu.html";
      } else {
        showError(res.message || "خطأ غير معروف");
      }
    });

    function showError(msg) {
      const errorDiv = document.getElementById("error");
      errorDiv.innerText = msg;
      errorDiv.style.display = "block";
    }

    async function apiPost(url, data) {
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });
      return res.json();
    }
  </script>
</body>
</html>
