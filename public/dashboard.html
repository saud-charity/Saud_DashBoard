<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة التحكم - مدرسة الشيخ سعود - فرع1</title>
  <link rel="stylesheet" href="css/main.css" />
  <style>
    /* Toolbar أسفل الأزرار */
    .pdf-toolbar {
      display: none;
      justify-content: center;
      gap: 10px;
      margin: 10px auto;
    }
    .pdf-toolbar button {
      padding: 8px 14px;
      font-size: 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      color: white;
    }
    .pdf-toolbar button.download { background: #2980b9; }
    .pdf-toolbar button.print { background: #f39c12; }
    .pdf-toolbar button.close { background: #e74c3c; }
    .pdf-toolbar button:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <header>
    <h1 id="pageTitle">لوحة التحكم</h1>
  </header>

  <main class="container">
    <div id="menuContainer" class="menu-container"></div>

    <div class="pdf-toolbar" id="pdfToolbar">
      <button class="download" onclick="downloadPdf()">تحميل</button>
      <button class="print" onclick="printPdf()">طباعة</button>
      <button class="close" onclick="closePdf()">إغلاق</button>
    </div>

    <iframe id="pdfViewer"></iframe>
  </main>

  <footer>
    <p>© جميع الحقوق محفوظة - مدرسة الشيخ سعود - فرع1</p>
  </footer>

  <script>
    let currentPdfFile = null;

    document.addEventListener("DOMContentLoaded", () => {
      const role = sessionStorage.getItem("role");
      if (!role) { window.location.href = "login.html"; return; }

      document.getElementById("pageTitle").textContent =
        role === "staff" ? "🧑‍🏫 لوحة المعلم / الإداري" : "🎓 لوحة الطالب / ولي الأمر";

      loadMenu(role);
    });

    async function loadMenu(role) {
      const container = document.getElementById("menuContainer");
      container.innerHTML = "";

      try {
        const res = await fetch(`/api/menu/${role}`);
        if (!res.ok) throw new Error("خطأ في تحميل القائمة");

        const menu = await res.json();
        if (!menu || menu.length === 0) { 
          container.innerHTML = "<p>❌ لا توجد عناصر</p>"; 
          return; 
        }

        menu.forEach(item => {
          const btn = document.createElement("button");
          btn.className = "menu-btn";
          btn.textContent = item.title;

          switch(item.type){
            case "pdf":
              btn.onclick = () => openPdf(item.filename);
              break;
            case "page":
              btn.onclick = () => window.location.href = item.path;
              break;
            case "external":
              btn.onclick = () => window.open(item.url, "_blank");
              break;
            case "submenu":
              btn.onclick = () => window.location.href = `/policies.html?role=${role}`;
              break;
            default:
              console.warn("نوع عنصر غير معروف:", item);
          }

          container.appendChild(btn);
        });
      } catch(err) {
        console.error(err);
        container.innerHTML = "<p>تعذر تحميل القائمة</p>";
      }
    }

    function openPdf(filename) {
      if(!filename) return;
      currentPdfFile = filename;
      const viewer = document.getElementById("pdfViewer");
      viewer.src = `/pdfs/${filename}`;
      viewer.style.display = "block";

      const toolbar = document.getElementById("pdfToolbar");
      toolbar.style.display = "flex";

      viewer.scrollIntoView({ behavior: "smooth" });
    }

    function downloadPdf(){
      if(!currentPdfFile) return;
      const link = document.createElement("a");
      link.href = `/pdfs/${currentPdfFile}`;
      link.download = currentPdfFile;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function printPdf(){
      if(!currentPdfFile) return;
      const printWindow = window.open(
        `/pdfs/${currentPdfFile}`,
        "_blank"
      );
      if(printWindow) printWindow.focus();
    }

    function closePdf(){
      document.getElementById("pdfViewer").style.display = "none";
      document.getElementById("pdfToolbar").style.display = "none";
      document.getElementById("pdfViewer").src = "";
      currentPdfFile = null;
    }
  </script>
</body>
</html>
