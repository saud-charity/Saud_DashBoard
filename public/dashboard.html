<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎓 لوحة التحكم</title>
<style>
  body {
    font-family: "Tahoma", Arial, sans-serif;
    text-align: center;
    padding: 20px;
    background: #f4f6f8;
  }

  h1 {
    margin-bottom: 20px;
    color: #333;
  }

  #menuContainer {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 15px;
  }

  .menu-btn {
    padding: 12px 20px;
    font-size: 1em;
    cursor: pointer;
    border: none;
    border-radius: 8px;
    background: #3498db;
    color: #fff;
    transition: 0.2s;
    min-width: 220px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  }

  .menu-btn:hover {
    background: #217dbb;
    transform: translateY(-2px);
  }

  /* PDF Viewer Section */
  #pdfContainer {
    display: none;
    position: relative; /* مهم لوضع الأزرار فوق الإطار */
    width: 90%;
    margin: 20px auto;
  }

  #pdfViewer {
    width: 100%;
    height: 600px;
    border: 1px solid #ccc;
    border-radius: 8px;
  }

  #pdfControls {
    position: absolute; /* لجعل الأزرار عائمة فوق الإطار */
    top: 10px;
    right: 10px;
    display: flex;
    gap: 10px;
    z-index: 10;
    background: rgba(255,255,255,0.8); /* خلفية شفافة قليلاً */
    padding: 5px 10px;
    border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
  }

  .pdf-btn {
    padding: 8px 12px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 1em;
    color: white;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: 0.2s;
  }

  #downloadBtn { background-color: #3498db; }
  #downloadBtn:hover { background-color: #217dbb; }

  #printBtn { background-color: #f39c12; }
  #printBtn:hover { background-color: #d68910; }

  #closeBtn { background-color: #e74c3c; }
  #closeBtn:hover { background-color: #c0392b; }

  @media (max-width: 768px) {
    #pdfViewer { height: 80vh; }
    #pdfControls { flex-direction: column; top: 5px; right: 5px; gap: 5px; }
    .pdf-btn { width: auto; }
    .menu-btn { width: 90%; font-size: 1em; padding: 10px; }
  }
</style>
</head>
<body>

<h1 id="pageTitle">🎓 لوحة التحكم</h1>
<div id="menuContainer"></div>

<!-- PDF Viewer Section -->
<div id="pdfContainer">
  <iframe id="pdfViewer"></iframe>
  <div id="pdfControls">
    <button class="pdf-btn" id="downloadBtn">⬇ تحميل PDF</button>
    <button class="pdf-btn" id="printBtn">🖨️ طباعة PDF</button>
    <button class="pdf-btn" id="closeBtn">❌ إغلاق الملف</button>
  </div>
</div>

<script>
const menuContainer = document.getElementById("menuContainer");
const pdfContainer = document.getElementById("pdfContainer");
const pdfViewer = document.getElementById("pdfViewer");
const downloadBtn = document.getElementById("downloadBtn");
const printBtn = document.getElementById("printBtn");
const closeBtn = document.getElementById("closeBtn");
const pageTitle = document.getElementById("pageTitle");

// 🔹 قراءة الدور من URL
const params = new URLSearchParams(window.location.search);
const role = params.get("role") || "student";

pageTitle.textContent = role === "staff"
  ? "🎓 لوحة تحكم الكادر الإداري والتدريسي"
  : "🎓 لوحة تحكم الطالب / ولي الأمر";

// تحميل القائمة من السيرفر
fetch(`/api/menu/${role}`)
  .then(res => res.json())
  .then(menuItems => renderMenu(menuItems))
  .catch(err => {
    console.error("خطأ في تحميل القائمة:", err);
    menuContainer.innerHTML = "<p style='color:red;'>❌ تعذر تحميل القائمة.</p>";
  });

// إنشاء الأزرار
function renderMenu(menu) {
  menuContainer.innerHTML = "";
  menu.forEach(item => {
    const btn = document.createElement("button");
    btn.className = "menu-btn";
    btn.textContent = item.title;
    btn.onclick = () => handleMenuClick(item);
    menuContainer.appendChild(btn);
  });
}

// التعامل مع النقر على عناصر القائمة
function handleMenuClick(item) {
  pdfContainer.style.display = "none";

  switch (item.type) {
    case "pdf":
      openPdf(item.filename);
      break;
    case "submenu":
      window.location.href = `/policies.html?role=${item.role}`;
      break;
    case "page":
      window.location.href = item.path;
      break;
    case "external":
      window.open(item.url, "_blank", "noopener,noreferrer");
      break;
  }
}

// ✅ عرض ملف PDF داخل PDF.js
function openPdf(filename) {
  const viewUrl = `/pdfs/${filename}`;
  const downloadUrl = `/pdfs/${filename}`;

  pdfViewer.src = `/pdfjs/web/viewer.html?file=${encodeURIComponent(viewUrl)}`;
  pdfContainer.style.display = "block";
  pdfContainer.scrollIntoView({ behavior: "smooth" });

  downloadBtn.onclick = () => window.open(downloadUrl, "_blank");

  printBtn.onclick = () => {
    const printFrame = document.createElement('iframe');
    printFrame.style.display = 'none';
    printFrame.src = downloadUrl;
    document.body.appendChild(printFrame);
    printFrame.contentWindow.focus();
    printFrame.contentWindow.print();
  };

  closeBtn.onclick = () => {
    pdfContainer.style.display = "none";
    pdfViewer.src = "";
  };
}
</script>

</body>
</html>
