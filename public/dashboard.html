<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة التحكم - مدرسة الشيخ سعود</title>
  <link rel="stylesheet" href="css/main.css" />
  <style>
    /* تعديل حجم الأزرار لتكون أصغر */
    .menu-btn {
      width: 100%;
      max-width: 300px;
      margin: 8px auto;
      font-size: 1em;
      padding: 10px 12px;
    }

    /* iframe PDF */
    #pdfViewer {
      width: 90%;
      height: 600px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin: 20px auto;
      display: none;
    }

    h1 {
      margin-bottom: 10px;
    }

    .menu-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding-bottom: 40px;
    }
  </style>
</head>
<body>
  <header>
    <h1 id="pageTitle">🔄 جاري التحميل...</h1>
  </header>

  <main class="menu-container">
    <div id="menuContainer"></div>
    <iframe id="pdfViewer"></iframe>
  </main>

  <footer>
    <p>© جميع الحقوق محفوظة - مدرسة الشيخ سعود - فرع1</p>
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const role = sessionStorage.getItem("role");
      if (!role) { 
        window.location.href = "login.html"; 
        return; 
      }

      document.getElementById("pageTitle").textContent =
        role === "staff" ? "🧑‍🏫 لوحة الموظف" : "🎓 لوحة الطالب / ولي الأمر";

      loadMenu(role);
    });

    async function loadMenu(role) {
      const container = document.getElementById("menuContainer");
      container.innerHTML = "";

      try {
        const res = await fetch(`/api/menu/${role}`);
        if (!res.ok) throw new Error("خطأ في تحميل القائمة");

        const menu = await res.json();
        if (!menu || menu.length === 0) { 
          container.innerHTML = "<p>❌ لا توجد عناصر</p>"; 
          return; 
        }

        menu.forEach(item => {
          const btn = document.createElement("button");
          btn.className = "menu-btn";
          btn.textContent = item.title;

          if (item.type === "pdf") btn.onclick = () => openPdf(item.filename);
          if (item.type === "page") btn.onclick = () => window.location.href = item.path;
          if (item.type === "external") btn.onclick = () => window.open(item.url, "_blank");
          if (item.type === "submenu") btn.onclick = () => window.location.href = `/policies.html?role=${role}`;

          container.appendChild(btn);
        });
      } catch (err) {
        console.error(err);
        container.innerHTML = "<p>تعذر تحميل القائمة</p>";
      }
    }

    function openPdf(filename) {
      const viewer = document.getElementById("pdfViewer");
      viewer.src = `/pdfs/${filename}`;
      viewer.style.display = "block";
      viewer.scrollIntoView({ behavior: "smooth" });
    }
  </script>
</body>
</html>
