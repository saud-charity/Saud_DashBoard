<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل الدخول - مدرسة الشيخ سعود - فرع1</title>
  <link rel="stylesheet" href="css/main.css" />
  <style>
    footer {
      text-align: center;
      padding: 15px;
      font-size: 0.9em;
      color: #777;
    }
  </style>
</head>
<body>
  <header>
    <h1>🔐 نظام الدخول الموحّد</h1>
  </header>

  <main class="container centered">
    <h2>مرحباً بك في مدرسة الشيخ سعود - فرع1</h2>

    <div id="usernameSection">
      <label for="username">اسم المستخدم</label>
      <input type="text" id="username" class="input" placeholder="أدخل اسم المستخدم" />
    </div>

    <label for="password">كلمة المرور</label>
    <input type="password" id="password" class="input" placeholder="أدخل كلمة المرور" />

    <label for="role">اختر الدور</label>
    <select id="role" class="input" onchange="toggleUsername()">
      <option value="">-- اختر الدور --</option>
      <option value="student">👨‍🎓 طالب / ولي الأمر</option>
      <option value="staff">🧑‍🏫 موظف</option>
    </select>

    <button class="btn" onclick="login()">تسجيل الدخول</button>
    <p id="loginMessage" style="color: red; margin-top: 10px;"></p>
  </main>

  <footer>
    <p>© جميع الحقوق محفوظة - مدرسة الشيخ سعود - فرع1</p>
  </footer>

  <script>
    // ✅ إخفاء/إظهار اسم المستخدم حسب الدور
    function toggleUsername() {
      const role = document.getElementById("role").value;
      const usernameSection = document.getElementById("usernameSection");
      usernameSection.style.display = (role === "staff") ? "block" : "none";
    }

    // ✅ تسجيل الدخول
    function login() {
      const role = document.getElementById("role").value;
      const password = document.getElementById("password").value.trim();
      const username = document.getElementById("username").value.trim();
      const msg = document.getElementById("loginMessage");

      msg.textContent = "";

      if (!role || !password || (role === "staff" && !username)) {
        msg.textContent = "❌ يرجى تعبئة الحقول المطلوبة";
        return;
      }

      if (role === "staff" && username === "admin" && password === "1234") {
        sessionStorage.setItem("role", "staff");
        window.location.href = "staff_menu.html";
      } 
      else if (role === "student" && password === "1234") {
        sessionStorage.setItem("role", "student");
        window.location.href = "student_menu.html";
      } 
      else {
        msg.textContent = "❌ بيانات الدخول غير صحيحة";
      }
    }

    // ✅ إخفاء الحقل افتراضياً عند التحميل
    document.addEventListener("DOMContentLoaded", toggleUsername);
  </script>
</body>
</html>
