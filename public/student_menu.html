<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📚 لوحة الطالب</title>
  <link rel="stylesheet" href="css/main.css" />
  <style>
    main {
      text-align: center;
      padding: 20px;
    }

    .btn-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .btn {
      padding: 10px 20px;
      font-size: 1rem;
      border-radius: 10px;
      background-color: #3498db;
      color: white;
      border: none;
      cursor: pointer;
      transition: 0.3s;
      min-width: 180px;
    }

    .btn:hover {
      background-color: #217dbb;
    }

    #pdfViewer {
      width: 90%;
      height: 600px;
      border: 2px solid #ccc;
      border-radius: 10px;
      margin: 0 auto;
      display: none;
    }

    footer {
      text-align: center;
      padding: 15px;
      font-size: 0.9em;
      color: #777;
    }
  </style>
</head>
<body>
  <header>
    <h1>🎓 لوحة الطالب</h1>
  </header>

  <main>
    <div class="btn-container">
      <button class="btn" onclick="openPdf('policy.pdf')">📘 السياسات</button>
      <button class="btn" onclick="openPdf('schedule.pdf')">📅 الجدول الدراسي</button>
      <button class="btn" onclick="openPdf('report.pdf')">📄 تقرير الطالب</button>
      <button class="btn" onclick="openPdf('links.pdf')">🔗 روابط خارجية</button>
    </div>

    <iframe id="pdfViewer"></iframe>
  </main>

  <footer>
    <p>© جميع الحقوق محفوظة - مدرسة الشيخ سعود - فرع1</p>
  </footer>

  <script>
    function openPdf(filename) {
      const pdfFrame = document.getElementById("pdfViewer");
      pdfFrame.src = `pdfs/${filename}`;
      pdfFrame.style.display = "block";
      pdfFrame.scrollIntoView({ behavior: "smooth" });
    }
  </script>
</body>
</html>
