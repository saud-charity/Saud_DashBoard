<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📄 السياسات</title>
<style>
  body {
    font-family: "Tahoma", Arial, sans-serif;
    text-align: center;
    padding: 20px;
    background: #f4f6f8;
  }

  h1 {
    margin-bottom: 20px;
    color: #333;
  }

  #policyContainer {
    display: none;
    width: 90%;
    margin: 20px auto;
    position: relative;
  }

  #policyViewer {
    width: 100%;
    height: 600px;
    border: 1px solid #ccc;
    border-radius: 8px;
  }

  #policyControls {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-bottom: 10px;
    position: static; /* ثابت فوق PDF */
    z-index: 10;
  }

  .pdf-btn {
    padding: 10px 15px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 1em;
    color: white;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: 0.2s;
  }

  #downloadBtn { background-color: #3498db; }
  #downloadBtn:hover { background-color: #217dbb; }

  #printBtn { background-color: #f39c12; }
  #printBtn:hover { background-color: #d68910; }

  #closeBtn { background-color: #e74c3c; }
  #closeBtn:hover { background-color: #c0392b; }

  @media (max-width: 768px) {
    #policyViewer { height: 80vh; }
    #policyControls { flex-direction: row; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
    .pdf-btn { flex: 1 1 45%; min-width: 100px; justify-content: center; }
  }
</style>
</head>
<body>

<h1>📄 السياسات</h1>

<!-- PDF Viewer Section -->
<div id="policyContainer">
  <div id="policyControls">
    <button class="pdf-btn" id="downloadBtn">⬇ تحميل PDF</button>
    <button class="pdf-btn" id="printBtn">🖨️ طباعة PDF</button>
    <button class="pdf-btn" id="closeBtn">❌ إغلاق الملف</button>
  </div>
  <iframe id="policyViewer"></iframe>
</div>

<script>
// عناصر الصفحة
const policyContainer = document.getElementById("policyContainer");
const policyViewer = document.getElementById("policyViewer");
const downloadBtn = document.getElementById("downloadBtn");
const printBtn = document.getElementById("printBtn");
const closeBtn = document.getElementById("closeBtn");

// قراءة نوع السياسة من URL
const params = new URLSearchParams(window.location.search);
const policyFile = params.get("file"); // مثال: file=policy1.pdf

if(policyFile) {
  openPolicy(policyFile);
}

// فتح PDF للسياسة
function openPolicy(filename) {
  const viewUrl = `/pdfs/${filename}`;
  const downloadUrl = `/pdfs/${filename}`;

  policyViewer.src = `/pdfjs/web/viewer.html?file=${encodeURIComponent(viewUrl)}`;
  policyContainer.style.display = "block";
  policyContainer.scrollIntoView({ behavior: "smooth" });

  downloadBtn.onclick = () => window.open(downloadUrl, "_blank");

  printBtn.onclick = () => {
    const printFrame = document.createElement('iframe');
    printFrame.style.display = 'none';
    printFrame.src = downloadUrl;
    document.body.appendChild(printFrame);
    printFrame.contentWindow.focus();
    printFrame.contentWindow.print();
  };

  closeBtn.onclick = () => {
    policyContainer.style.display = "none";
    policyViewer.src = "";
  };
}
</script>

</body>
</html>
