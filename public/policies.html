<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>السياسات</title>
  <link rel="stylesheet" href="css/main.css">
  <style>
    /* إضافات بسيطة خاصة بالصفحة */
    #policiesContainer {
      max-width: 700px;
      margin: 20px auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .policy-btn {
      background: #3498db;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 12px;
      font-size: 1.1em;
      cursor: pointer;
      transition: 0.2s;
    }

    .policy-btn:hover {
      background: #2980b9;
    }

    #pdfViewer {
      width: 90%;
      height: 600px;
      margin: 20px auto;
      border: 1px solid #ccc;
      border-radius: 8px;
      display: none;
    }

    #pdfToolbar {
      display: none;
      justify-content: center;
      gap: 8px;
      margin: 10px auto;
    }

    #pdfToolbar button {
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      color: white;
    }

    #pdfToolbar button:nth-child(1) { background: #2980b9; }
    #pdfToolbar button:nth-child(2) { background: #f39c12; }
    #pdfToolbar button:nth-child(3) { background: #e74c3c; }

    #pdfToolbar button:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <header>
    <h1>📄 السياسات</h1>
  </header>

  <main class="container">
    <div id="policiesContainer"></div>

    <div id="pdfToolbar">
      <button onclick="downloadPdf()">💾 تحميل</button>
      <button onclick="printPdf()">🖨️ طباعة</button>
      <button onclick="closePdf()">❌ إغلاق</button>
    </div>

    <iframe id="pdfViewer"></iframe>
  </main>

  <script>
    let currentPdfFile = null;

    document.addEventListener("DOMContentLoaded", async () => {
      const role = sessionStorage.getItem("role");
      if (!role) {
        window.location.href = "login.html";
        return;
      }

      const container = document.getElementById("policiesContainer");

      try {
        const res = await fetch(`/api/policies/${role}`);
        if (!res.ok) throw new Error("تعذر تحميل السياسات");

        const policies = await res.json();
        if (!policies || policies.length === 0) {
          container.innerHTML = "<p>❌ لا توجد سياسات متاحة</p>";
          return;
        }

        policies.forEach(item => {
          const btn = document.createElement("button");
          btn.className = "policy-btn";
          btn.textContent = item.title;
          btn.onclick = () => openPdfSmart(item.filename);
          container.appendChild(btn);
        });

      } catch (err) {
        console.error(err);
        container.innerHTML = "<p>❌ خطأ في تحميل السياسات</p>";
      }
    });

    function openPdfSmart(filename){
      if(!filename) return alert("❌ لم يتم تحديد الملف");
      currentPdfFile = filename;
      const viewer = document.getElementById("pdfViewer");
      const toolbar = document.getElementById("pdfToolbar");
      viewer.src = `/pdfs/${filename}`;
      viewer.style.display = "block";
      toolbar.style.display = "flex";
      viewer.scrollIntoView({behavior:"smooth"});
    }

    function downloadPdf(){
      if(!currentPdfFile) return;
      const link = document.createElement("a");
      link.href = `/pdfs/${currentPdfFile}`;
      link.download = currentPdfFile;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function printPdf(){
      if(!currentPdfFile) return;
      const printWindow = window.open(`/pdfs/${currentPdfFile}`, "_blank");
      if(printWindow) printWindow.focus();
    }

    function closePdf(){
      document.getElementById("pdfViewer").style.display = "none";
      document.getElementById("pdfToolbar").style.display = "none";
      document.getElementById("pdfViewer").src = "";
    }
  </script>
</body>
</html>
